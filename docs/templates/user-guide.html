<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title>
<style>
:root{color-scheme:light;--ink:#203049;--muted:#58687b;--line:#d7e0e7;--accent:#245c97}*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:var(--ink);font:16px/1.85 system-ui,"Meiryo",sans-serif}main{max-width:1080px;margin:auto;padding:38px 28px 72px}h1{font-size:30px;line-height:1.5;margin:10px 0 14px}h2{font-size:23px;margin:38px 0 14px}h3{font-size:18px;margin:24px 0 8px}p{margin:10px 0 16px}a{color:#185aab;text-underline-offset:3px}code,pre{font-family:Consolas,monospace}code{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px;background:#223147;color:#f5f8fd;padding:18px 20px;font-size:14px;line-height:1.7}table{border-collapse:collapse;width:100%;background:white}th,td{border-bottom:1px solid var(--line);padding:13px 16px;text-align:left;vertical-align:top}th{font-weight:600;background:#eaf0f6}ul,ol{padding-left:24px}li{margin:8px 0}.eyebrow,.note,footer{font-size:14px;color:var(--muted)}.status{border-left:5px solid #397e69;border-radius:0 8px 8px 0;padding:20px 24px;background:#e7f3ed;margin:24px 0}.status.pending,.status.example{border-color:#ba8528;background:#fff4d9}.status.running{border-color:#3578af;background:#e9f2fb}.status.interrupted{border-color:#b64444;background:#fbecec}.status strong{display:block;font-size:19px}.status p{margin:8px 0 0}.actions,nav,.steps{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.actions a{padding:9px 16px;background:white;border:1px solid var(--line);border-radius:6px}.preview{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px}.steps span{padding:8px 14px;background:white;border:1px solid var(--line);border-radius:5px}.monitor-row{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0}.monitor{flex:1;min-width:235px;background:white;border:3px solid #90a9bf;border-bottom-width:14px;border-radius:8px;padding:20px}.monitor.primary{border-color:#3b789f}.monitor strong{display:block;font-size:18px}.callout{border:1px solid var(--line);background:white;border-radius:8px;padding:16px 20px}.next{margin-top:34px;border-top:2px solid var(--line);padding-top:16px}footer{margin-top:35px;border-top:1px solid var(--line);padding-top:16px}@media(max-width:600px){main{padding:24px 16px}h1{font-size:25px}td,th{padding:9px;font-size:14px}.status{padding:15px}pre{font-size:13px}}@media print{body{background:white}pre{color:black;background:#f1f3f5}main{max-width:none;padding:0}.status,table,.monitor-row{break-inside:avoid}}
</style></head><body><main>
<p class="eyebrow">AutoClip · ユーザー向け手順</p>
<h1>$title</h1>
<p>$summary</p>
<section class="status $status" aria-label="現在の状態"><strong>$status_title</strong><p>$status_detail</p></section>
$nav_html
$display_html
$body_html
<section class="next" id="next"><h2>次に行う操作</h2><p>$next_action</p></section>
<footer>案内の順序：現在の状態 → 開始前の準備 → 実行手順 → 完了の合図 → 中断時 → 次の操作。<br>このページは共通HTMLテンプレートから生成しています。</footer>
</main></body></html>
